<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — NIME</title>
  <meta name="description" content="Tonton anime">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/" class="nav-brand">NIME</a>
      <button class="hamburger" aria-label="Buka menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="/" data-nav>Home</a></li>
        <li><a href="/latest" data-nav>Terbaru</a></li>
        <li><a href="/genre" data-nav>Genre</a></li>
        <li>
          <form class="search-form" action="/search" data-search-form>
            <input type="search" name="q" placeholder="Cari anime..." autocomplete="off" aria-label="Cari anime">
          </form>
        </li>
      </ul>
    </div>
  </nav>

  <main id="main-content">
    <div class="container">
      <div id="watch-layout" class="watch-layout hidden">
        <div id="video-section">
          <!-- Custom HTML5 Video Player Container -->
          <div id="player-wrapper" class="player-wrapper">
            <video id="video-player" playsinline preload="auto"></video>
            
            <!-- Big center play overlay -->
            <button id="btn-center-play" class="center-play-btn" aria-label="Play video">
              ▶
            </button>

            <!-- Loading Overlay -->
            <div id="loading-overlay" class="loading-overlay hidden">
              <div class="spinner"></div>
              <span>Memuat video...</span>
            </div>

            <!-- Error Overlay -->
            <div id="error-overlay" class="error-overlay hidden">
              <p>Video gagal dimuat.</p>
              <p style="font-size:0.8rem;color:#aaa">Coba server atau kualitas lain.</p>
              <button id="retry-video">Coba Lagi</button>
            </div>

            <!-- Custom Controls Bar -->
            <div id="custom-controls" class="custom-controls">
              <!-- Seekbar -->
              <div class="seek-container">
                <input type="range" id="seek-bar" class="seek-bar" value="0" min="0" max="100" step="0.1" aria-label="Progress bar">
                <div id="seek-fill" class="seek-fill"></div>
              </div>

              <div class="controls-row">
                <div class="controls-left">
                  <button id="btn-play-pause" class="ctrl-btn" aria-label="Play/Pause">▶</button>
                  <button id="btn-mute" class="ctrl-btn" aria-label="Mute/Unmute">🔊</button>
                  <input type="range" id="volume-bar" class="volume-bar" value="1" min="0" max="1" step="0.05" aria-label="Volume">
                  <span id="time-display" class="time-display">00:00 / 00:00</span>
                </div>

                <div class="controls-right">
                  <div class="quality-dropdown">
                    <button id="btn-quality" class="ctrl-btn text-btn">Quality</button>
                    <div id="quality-menu" class="quality-menu hidden"></div>
                  </div>
                  <button id="btn-pip" class="ctrl-btn" aria-label="Picture in Picture" title="PiP">⧉</button>
                  <button id="btn-fullscreen" class="ctrl-btn" aria-label="Fullscreen">⛶</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Bottom Navigation / Info bar -->
          <div class="player-controls-bar">
            <div id="quality-select" class="quality-select"></div>
            <div class="episode-nav">
              <button id="prev-ep" disabled>← Sebelumnya</button>
              <span id="episode-label"></span>
              <button id="next-ep">Berikutnya →</button>
            </div>
          </div>
        </div>

        <aside class="episode-sidebar" id="episode-sidebar">
          <h3>Episode</h3>
          <div id="sidebar-episodes" class="episode-list"></div>
        </aside>
      </div>

      <div id="error-block" class="error-block hidden">
        <p>Gagal memuat episode.</p>
        <button id="retry-watch">Coba Lagi</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>NIME — Anime Streaming</p>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/watch.js"></script>
</body>
</html>
