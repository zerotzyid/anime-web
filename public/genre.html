<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genre — NIME</title>
  <meta name="description" content="Daftar genre anime">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/" class="nav-brand">NIME</a>
      <button class="hamburger" aria-label="Buka menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="/" data-nav>Home</a></li>
        <li><a href="/latest" data-nav>Terbaru</a></li>
        <li><a href="/genre" data-nav>Genre</a></li>
        <li>
          <form class="search-form" action="/search" data-search-form>
            <input type="search" name="q" placeholder="Cari anime..." autocomplete="off" aria-label="Cari anime">
          </form>
        </li>
      </ul>
    </div>
  </nav>

  <main id="main-content">
    <div class="container">
      <h1 id="page-title">Genre</h1>
      <div class="genre-list" id="genre-list"></div>
      <div class="skeleton-grid" id="skeleton-grid">
        <div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div></div>
      </div>
      <div id="anime-grid" class="anime-grid hidden"></div>
      <div id="pagination" class="pagination hidden"></div>
      <div id="error-block" class="error-block hidden">
        <p>Gagal mengambil data.</p>
        <button onclick="location.reload()">Coba Lagi</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>NIME — Anime Streaming</p>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/anime.js"></script>
</body>
</html>
