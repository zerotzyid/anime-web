<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIME — Anime Streaming</title>
  <meta name="description" content="NIME — Anime streaming sederhana, modern, ringan.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/" class="nav-brand">NIME</a>
      <button class="hamburger" aria-label="Buka menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="/" data-nav>Home</a></li>
        <li><a href="/latest" data-nav>Terbaru</a></li>
        <li><a href="/genre" data-nav>Genre</a></li>
        <li>
          <form class="search-form" action="/search" data-search-form>
            <input type="search" name="q" placeholder="Cari anime..." autocomplete="off" aria-label="Cari anime">
          </form>
        </li>
      </ul>
    </div>
  </nav>

  <main id="main-content">
    <!-- Skeleton loading -->

    </div>

    <!-- Hero / Featured -->
    <section id="hero-section" class="section hidden"></section>

    <!-- Sections -->
    <section id="latest-section" class="section hidden"></section>
    <section id="history-section" class="section hidden"></section>
    <section id="genre-section" class="section hidden"></section>
  </main>

  <footer class="footer">
    <p>NIME — Anime Streaming</p>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/anime.js"></script>
</body>
</html>
